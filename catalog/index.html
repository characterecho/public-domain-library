<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://images.squarespace-cdn.com/content/693e911fb26d4b4b3a52c2ce/92c9d8a1-9c41-4cad-8fef-6417bf021ae5/browser.png">
  <title>Public Domain Audiobook Library | Character Echo</title>
  <meta name="description" content="Browse our collection of public domain audiobooks with unique character voices. Classic literature brought to life with AI-powered voice acting.">

  <!-- Open Graph meta tags -->
  <meta property="og:title" content="Public Domain Audiobook Library">
  <meta property="og:description" content="Classic literature brought to life with unique character voices.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://library.characterecho.com/">

  <!-- Twitter Card meta tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Public Domain Audiobook Library">
  <meta name="twitter:description" content="Classic literature brought to life with unique character voices.">

  <!-- Schema.org structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Public Domain Audiobook Library",
    "description": "A collection of public domain audiobooks with unique character voices",
    "publisher": {
      "@type": "Organization",
      "name": "Character Echo",
      "url": "https://characterecho.com"
    }
  }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-color: #e0e0e0;
      --card-bg: #ffffff;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --card-shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: #ffffff;
      min-height: 100vh;
      color: var(--text-primary);
    }

    /* Navigation */
    .nav {
      background: #000000;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
    }

    .nav-logo img {
      height: 32px;
      width: auto;
    }

    @media (min-width: 768px) {
      .nav-logo img {
        height: 38px;
      }
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-link {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: white;
    }

    .nav-link.active {
      color: white;
    }

    .nav-cta {
      background: var(--primary-color);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .nav-cta:hover {
      background: var(--primary-hover);
    }

    .nav-mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.95);
        flex-direction: column;
        padding: 1rem;
        gap: 1rem;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-mobile-toggle {
        display: block;
      }

      .nav-container {
        position: relative;
      }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .header .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Search and Filter */
    .search-bar {
      max-width: 500px;
      margin: 0 auto 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      background: #ffffff;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .filter-tag {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tag:hover {
      background: #f5f5f5;
      color: var(--text-primary);
      border-color: #ccc;
    }

    .filter-tag.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }

    /* Stats */
    .stats {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Book Grid */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .book-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 2rem;
      }
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow-hover);
    }

    .book-cover-wrapper {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #f5f5f5;
    }

    .book-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #ccc;
      background: #f0f0f0;
    }

    .book-duration {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.75);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: white;
    }

    .book-info {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      line-height: 1.3;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: auto;
    }

    .book-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: #f5f5f5;
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .store-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .store-button {
      display: block;
      transition: transform 0.2s, opacity 0.2s;
    }

    .store-button:hover {
      transform: scale(1.05);
      text-decoration: none;
    }

    .store-button img {
      height: 50px;
      width: auto;
    }

    .cta-section {
      margin-top: 2rem;
    }

    .cta-button {
      display: inline-block;
      background: var(--primary-color);
      color: white;
      padding: 0.875rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }

    .cta-button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="https://www.characterecho.com" class="nav-logo">
        <img src="https://images.squarespace-cdn.com/content/v1/693e911fb26d4b4b3a52c2ce/897e932a-9fe1-4167-b7c3-51b2a0ecda07/White+logo+-+no+background.png" alt="Character Echo">
      </a>
      <button class="nav-mobile-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
      <div class="nav-links" id="navLinks">
                <a href="https://library.characterecho.com" class="nav-link active">Library</a>
        <a href="https://www.characterecho.com/about" class="nav-link">About</a>
        <a href="https://www.characterecho.com/contact" class="nav-link">Contact</a>
              </div>
    </div>
  </nav>

  <div class="container">
    <header class="header">
      <h1>Public Domain Audiobook Library</h1>
      <p class="subtitle">Classic literature brought to life with unique character voices</p>

      <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by title or author...">
      </div>

      <div class="filter-tags" id="filterTags">
        <button class="filter-tag active" data-filter="all">All</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <main class="book-grid" id="bookGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading library...</p>
      </div>
    </main>

    <footer class="footer">
      <div class="store-buttons">
        <a href="https://apps.apple.com/us/app/character-echo/id6756740052" class="store-button">
          <img src="https://images.squarespace-cdn.com/content/v1/693e911fb26d4b4b3a52c2ce/abb8c6f4-7146-4798-be3b-0e2e84e0c9bb/app_store.png" alt="Download on the App Store">
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.characterecho.mobile_app" class="store-button">
          <img src="https://images.squarespace-cdn.com/content/v1/693e911fb26d4b4b3a52c2ce/d7da6dd1-9329-42c4-b483-4e193b06c821/GetItOnGooglePlay_Badge_Web_color_English.png" alt="Get it on Google Play">
        </a>
      </div>
      <p style="margin-top: 2rem;">
        Powered by <a href="https://characterecho.com">Character Echo</a>
      </p>
    </footer>
  </div>

  <script>
    const MANIFEST_URL = '/publications/recent-v2.json';
    const PREVIEW_BASE = '/publications';

    let allPublications = [];
    let activeFilter = 'all';
    let searchQuery = '';

    async function loadManifest() {
      try {
        const response = await fetch(MANIFEST_URL);
        if (!response.ok) throw new Error('Failed to load manifest');
        const data = await response.json();
        allPublications = data.publications || [];

        // Build filter tags from genre_tags
        buildFilterTags();

        // Render initial grid
        renderGrid();
      } catch (error) {
        console.error('Error loading manifest:', error);
        document.getElementById('bookGrid').innerHTML = `
          <div class="empty-state">
            <p>Unable to load library. Please try again later.</p>
          </div>
        `;
      }
    }

    function buildFilterTags() {
      const tagCounts = {};
      allPublications.forEach(pub => {
        (pub.genre_tags || []).forEach(tag => {
          tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
      });

      // Sort by count and take top tags
      const topTags = Object.entries(tagCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([tag]) => tag);

      const container = document.getElementById('filterTags');
      topTags.forEach(tag => {
        const button = document.createElement('button');
        button.className = 'filter-tag';
        button.dataset.filter = tag;
        button.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
        button.addEventListener('click', () => setFilter(tag));
        container.appendChild(button);
      });
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tag').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderGrid();
    }

    function filterPublications() {
      return allPublications.filter(pub => {
        // Filter by genre
        if (activeFilter !== 'all') {
          if (!(pub.genre_tags || []).includes(activeFilter)) {
            return false;
          }
        }

        // Filter by search query
        if (searchQuery) {
          const query = searchQuery.toLowerCase();
          const title = (pub.title || '').toLowerCase();
          const author = (pub.author_names || '').toLowerCase();
          if (!title.includes(query) && !author.includes(query)) {
            return false;
          }
        }

        return true;
      });
    }

    function renderGrid() {
      const filtered = filterPublications();
      const grid = document.getElementById('bookGrid');
      const stats = document.getElementById('stats');

      stats.textContent = `${filtered.length} audiobook${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <p>No audiobooks found matching your criteria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(pub => {
        const previewUrl = `${PREVIEW_BASE}/${pub.publication_identifier}/preview/`;
        const coverUrl = pub.cover_url || `${previewUrl}cover.jpg`;
        const durationSeconds = pub.duration?.total_seconds || 0;
        const duration = durationSeconds > 0 ? (pub.duration?.formatted || '') : '';
        const tags = (pub.genre_tags || []).slice(0, 3);

        return `
          <a href="${previewUrl}" class="book-card">
            <div class="book-cover-wrapper">
              <img
                src="${coverUrl}"
                alt="${escapeHtml(pub.title)}"
                class="book-cover"
                loading="lazy"
                onerror="this.parentElement.innerHTML='<div class=\\'book-cover-placeholder\\'>${escapeHtml(pub.title?.charAt(0) || '?')}</div>'"
              >
              ${duration ? `<span class="book-duration">${duration}</span>` : ''}
            </div>
            <div class="book-info">
              <h2 class="book-title">${escapeHtml(pub.title)}</h2>
              <p class="book-author">${escapeHtml(pub.author_names)}</p>
              ${tags.length ? `
                <div class="book-tags">
                  ${tags.map(tag => `<span class="book-tag">${escapeHtml(tag)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          </a>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Search input handler
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderGrid();
    });

    // "All" filter click handler
    document.querySelector('[data-filter="all"]').addEventListener('click', () => setFilter('all'));

    // Mobile nav toggle
    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    // Load on page ready
    loadManifest();
  </script>
</body>
</html>
